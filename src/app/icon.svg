<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Medalhão de figura vermelha: disco quase-preto, greca na borda, Hidra em
       terracota. Desenho original — a referência era arte de banco de imagens. -->
  <rect width="64" height="64" rx="14" fill="#131110"/>
  <!-- greca (meandro): um módulo desenhado uma vez e repetido pela borda -->
  <defs>
    <path id="m" d="M0 0h6v6H2v2h6V0h2v10H0z" fill="#b4462a"/>
  </defs>
  <g fill="#b4462a">
    <use href="#m" x="4" y="4"/><use href="#m" x="16" y="4"/><use href="#m" x="28" y="4"/><use href="#m" x="40" y="4"/><use href="#m" x="52" y="4"/>
    <use href="#m" x="4" y="50"/><use href="#m" x="16" y="50"/><use href="#m" x="28" y="50"/><use href="#m" x="40" y="50"/><use href="#m" x="52" y="50"/>
  </g>
  <!-- Hidra de três cabeças -->
  <g transform="translate(6.7 8) scale(2.03)">
    <g stroke="#b4462a" stroke-width="2.1" stroke-linecap="round" fill="none">
      <path d="M10.9 19.4C9.7 16 8.2 13.3 6.2 11"/>
      <path d="M12 19.9V7.6"/>
      <path d="M13.1 19.4c1.2-3.4 2.7-6.1 4.7-8.4"/>
    </g>
    <g fill="#b4462a">
      <path d="m6.3 11.2-4.1-1.9 3.1-.3-1.7-2.4 3.9 2.8-1.2 1.8Z"/>
      <path d="M12.1 7.8 9.6 4.1l2.7 1.1.9-2.7 1 4.6-2.1.7Z"/>
      <path d="m17.7 11.2 4.1-1.9-3.1-.3 1.7-2.4-3.9 2.8 1.2 1.8Z"/>
      <path d="M12 18.2c2.9 0 5.2 1 6.9 3H5.1c1.7-2 4-3 6.9-3Z"/>
    </g>
  </g>
</svg>
